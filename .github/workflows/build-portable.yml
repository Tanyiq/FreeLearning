name: Build Windows Portable EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build portable EXE
        run: pnpm run package:portable

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Domain-Agent-Workbench-Windows-x64
          path: release/Domain-Agent-Workbench-*-x64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = Get-ChildItem 'release/Domain-Agent-Workbench-*-x64.exe' | Select-Object -First 1
          gh release create '${{ github.ref_name }}' $asset.FullName --generate-notes --title '${{ github.ref_name }}'
